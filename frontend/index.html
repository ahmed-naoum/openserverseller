<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/new logo/logo filess-25.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SILACOD - Plateforme de Dropshipping White-Label au Maroc. Lancez votre marque de cosmétiques et compléments alimentaires." />
    <meta name="keywords" content="dropshipping, maroc, cosmétiques, compléments alimentaires, white-label, private-label" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Warm the DNS/TLS handshake for the Turnstile captcha so the widget does not
         cold-start at the final registration step (the main source of captcha lag). -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com">
    <!-- Warm CDN & Pixel domains for fast /r/:code checkout loading -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link rel="preconnect" href="https://connect.facebook.net" crossorigin>
    <link rel="dns-prefetch" href="https://connect.facebook.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>SILACOD - Dropshipping White-Label Maroc</title>
    <!-- LogRocket Setup -->
    <script>
      if (!window.LogRocket) {
        const script = document.createElement('script');
        script.src = "https://cdn.logr-in.com/LogRocket.min.js";
        script.crossOrigin = "anonymous";
        script.onload = function() {
          if (window.LogRocket) {
            window.LogRocket.init('gvv9dw/silacod', {
              network: {
                requestSanitizer: function(request) {
                  var url = request.url.toLowerCase();
                  if (
                    url.indexOf('browser/ebpaap') !== -1 ||
                    url.indexOf('properties://') === 0 ||
                    url.indexOf('chrome-extension://') === 0 ||
                    url.indexOf('moz-extension://') === 0
                  ) {
                    return null;
                  }
                  return request;
                }
              }
            });
          }
        };
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
