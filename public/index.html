<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server File Upload Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glob glob-1"></div>
  <div class="background-glob glob-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>Local Upload Server</h1>
          <p class="subtitle">Fast, self-hosted file storage (Up to 200MB)</p>
        </div>
      </div>
      <div class="badge-status">
        <span class="status-dot"></span> Server Active
      </div>
    </header>

    <!-- Upload Area -->
    <main class="main-content">
      <section class="upload-card glass-panel">
        <h2>Upload Files</h2>
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" multiple hidden>
          <div class="dropzone-content">
            <div class="upload-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 16V4M12 4L7 9M12 4L17 9M4 20H20" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h3>Drag & Drop files here</h3>
            <p>or <button class="btn-browse" onclick="document.getElementById('fileInput').click()">browse from device</button></p>
            <span class="file-limits-info">Maximum file size: 200MB</span>
          </div>
        </div>

        <!-- Selected files queue preview -->
        <div id="fileQueue" class="file-queue hidden">
          <h4>Files Ready to Upload (<span id="queueCount">0</span>)</h4>
          <div id="queueList" class="queue-list"></div>
          <div class="upload-actions">
            <button id="btnUpload" class="btn-primary">
              <span>Start Upload</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button id="btnClearQueue" class="btn-secondary">Clear Queue</button>
          </div>
        </div>

        <!-- Progress Bar -->
        <div id="progressContainer" class="progress-container hidden">
          <div class="progress-header">
            <span id="progressStatus">Uploading...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
          </div>
        </div>
      </section>

      <!-- Files Gallery / List -->
      <section class="gallery-card glass-panel">
        <div class="gallery-header">
          <h2>Server Files (<span id="fileCount">0</span>)</h2>
          <button id="btnRefresh" class="btn-icon" title="Refresh files list">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
        </div>

        <div id="fileGrid" class="file-grid">
          <!-- Dynamically populated -->
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📁</div>
          <p>No files uploaded yet. Drag files above to start!</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
